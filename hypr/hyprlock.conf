
general {
    hide_cursor = true
    disable_loading_bar = true
    ignore_empty_input = false
}




animations {
    enabled = true

    bezier = linear, 0, 0, 1, 1

    animation = fadeIn, 1, 15, linear
    animation = fadeOut, 1, 5, linear

    animation = inputFieldDots, 1, 0.20, linear
    animation = inputFieldWidth, 1, 0.20, linear
    animation = inputFieldColors, 1, 0.20, linear
}



background {
    monitor =
    path = screenshot

    blur_passes = 2
    blur_size = 5
    noise = 0
    contrast = 0.95
    brightness = 0.85
    vibrancy = 1
}

# Large circular icon
image {
    monitor =
    path = ~/.config/hypr/assets/lock.png
    size = 180
    rounding = -1
    border_size = 3

    halign = center
    valign = center
    position = 0, 180
}

image {
    monitor =
    path = ~/.config/hypr/assets/lock.jpg
    size = 180
    rounding = -1
    border_size = 3

    halign = center
    valign = center
    position = 0, 180
}

image {
    monitor =
    path = ~/.config/hypr/assets/lock.jpeg
    size = 180
    rounding = -1
    border_size = 3

    halign = center
    valign = center
    position = 0, 180
}

# Large clock
label {
    monitor =
    text = $TIME

    font_family = JetBrainsMono Nerd Font
    font_size = 100
    color = rgba(255, 255, 255, 1.0)

    halign = center
    valign = center
    position = 0, 10
}

# Date below the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"

    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgba(230, 230, 240, 0.85)

    halign = center
    valign = center
    position = 0, -80
}

# Invisible password field until typing
input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2

    dots_size = 0.12
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(20, 20, 25, 0.55)
    font_color = rgba(255, 255, 255, 1.0)
    
    rounding = 24

    fade_on_empty = false
    placeholder_text =

    halign = center
    valign = center
    position = 0, -180
}

